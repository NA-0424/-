<!DOCTYPE html>
<html lang="ja">
<link rel = "stylesheet" href = "css/zukan1.css">
<head>
 <meta charset="UTF-8">
 <title>植物図鑑</title>

    <!--フォントの設定-->
    <link rel="preconnect" href="https://fonts.googleapits.com">
    <link rel="perconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Philosopher&display=swap" rel="stylesheet">
</head>
<body>
 <h1>合同エリア</h1>


 <!--入力欄 -->
 <div>
   <input type="text" id="plantInput" placeholder="植物の名を入力">
   <button id="searchBtn" onclick="searchPlant()">決定</button>
 </div>
 <p id="husei" style="color:red;"></p>
 <h2 id="hint"></h2>


 <!-- カード5枚（最初は裏面） -->
 <div>
   <img id="card1" class="card" src="images/kard0.png">
   <img id="card2" class="card" src="images/kard0.png">
   <img id="card3" class="card" src="images/kard0.png">
   <img id="card4" class="card" src="images/kard0.png">
 </div>

<!-- クイズボタン（最初は非表示） -->
  <div id="quizBtn"style="display:none;">
    <button id="quiz" onclick="goQuiz()">クイズに挑戦！</button>
    <button onclick="reset()">カードをすべて裏返す</button>
  </div>
 
 <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
 <script>
   //ヒントの記入
    const hints= [
      {hint:"ラン"},
      {hint: "シクラメン"},
      {hint: "ハナキリン"},
      {hint: "ポインセチア"}
    ];
   // 図鑑2の植物
   const plantList = {
     "ラン": { id: "card1", img: "ran.png" },
     "シクラメン": { id: "card2", img: "sikura.png" },
     "ハナキリン": { id: "card3", img: "hana.png" },
     "ポインセチア": { id: "card4", img: "poin.png" },
   };


   // カードの裏面
   const defaultImage = "images/kard0.png";


   // ページ読み込み時に保存データを反映
   window.onload = function() {
     let allFlipped = true;
     //植物リストから名前（ローマ字）を抽出
     for (let name in plantList) {
       const cardId = plantList[name].id;//画像IDを取得
       //zukan1nameがtrueかどうか
       const saved = localStorage.getItem("zukan2-" + name);
       if (saved === "true") {
         document.getElementById(cardId).src = "images/" + plantList[name].img;
       } else {
         document.getElementById(cardId).src = defaultImage;
         allFlipped = false;
       }
     }
     // 全部揃ったらクイズ解放
     if (allFlipped) {
       document.getElementById("quizBtn").style.display = "inline-block";
       alert("クイズに挑戦しよう！");
     }

    const hint = document.getElementById("hints");
    const hintBtn = document.getElementById("hintsBtn");
    let hintID = localStorage.getItem("zukan2-hint");

   }


   // 植物検索
   function searchPlant() {
     const input = document.getElementById("plantInput").value.trim();//入力されたものを入れる
     const plant = plantList[input];


     if (plant) {
       // localStorage に保存
       localStorage.setItem("zukan2-" + input, "true");
       // correct.html に飛ぶ
       window.location.href = "correct2.html?area=zukan2&name=" + encodeURIComponent(input);
     } else {
       document.getElementById("husei").textContent = "その植物は存在しません";
     }
   }


   // クイズに飛ぶ
   function goQuiz() {
     window.location.href = "quiz2.html";
   }


   //リセットボタン
   function reset(){
       if (confirm("最初からになりますがいいですか？")){
           for (let i = 1; i < 5; i++ ){
               const img = document.getElementById("card" + i);
               img.src = defaultImage;
               let allFlipped = false
               document.getElementById("quizBtn").style.display = 'none';
           }
           localStorage.clear();//ローカルストレージを空にする
           alert("植物を燃やしました");
       }else{
           alert("キャンセルしました");
       }
   }

   $(document).ready(function(){
    $('#card1').on('click',function(){
      $('#hint')
      .text(hints[0].hint)  // ヒント内容をセット
      .removeClass('show')      // 一旦リセット（連続クリック対応）
      .hide()                   // 一瞬非表示にして
      .fadeIn(200)              // ふわっと表示
      .addClass('show');        // スタイル反映
    });
    $('#card2').on('click',function(){
      $('#hint')
      .text(hints[1].hint)  
      .removeClass('show')      
      .hide()                   
      .fadeIn(200)              
      .addClass('show');
    });
    $('#card3').on('click',function(){
      $('#hint')
      .text(hints[2].hint)  
      .removeClass('show')      
      .hide()                  
      .fadeIn(200)              
      .addClass('show');
    });
    $('#card4').on('click',function(){
      $('#hint')
      .text(hints[3].hint)  
      .removeClass('show')      
      .hide()                   
      .fadeIn(200)              
      .addClass('show');
    });
  });

  
 </script>
 </body>
</html>
