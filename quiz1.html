<!DOCTYPE html>
<html lang="ja">
<link rel="stylesheet" href="css/quiz.css">
<head>
    <meta charset="UTF-8">
    <title>植物クイズ</title>
    <meta name="viewport" content="width=device-width", initial-scale="1">
    <!--フォントの設定-->
    <link rel="preconnect" href="https://fonts.googleapits.com">
    <link rel="perconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Philosopher&display=swap" rel="stylesheet">
</head>
<body>
    <h2 id="question"></h2>
    <h3 id = "quizResult"></h3>
    <div id="cardArea">
    <img id = "picture" src= "" alt = "植物の写真" style="display: none;"></div>
    <div id="choices"></div> <!--divで選択肢をグループ化-->
    <h2 id="result"></h2>
    <button id="start-btn" onclick="showQuestion()">クイズを始める</button>
    <div class = "endBtn">
        <button id="next"onclick="nextQuestion()" style = "display: none;"></button> <!--最初は非表示-->
        <button id="eria" onclick="location.href='eria.html'" style="display: none">エリア選択に戻る</button>
    </div>

    <script>
        let keka=[];
        let saveData = {
             name: "大温室",   // エリアの名前
             result: keka      // 結果の配列
        };
        const quiz = [
        {
            question: "モクセンナはどんな場所を好む？",
            choices: ["寒い場所","温かい場所","カラカラの場所","海の中"],
            answer: 1,
            picture: "images/moku.png" //写真の名前
        },
        {
            question: "コエビソウは本物の”小エビの尻尾”からつけられた名前？",
            choices: ["もちろん！","実はちがう..."],
            answer: 0,
            picture: "images/koebi.png"
        },
        {
            question: "フイリソシンカはどんな匂いがする？",
            choices: ["苦いかおり","すっぱいにおい","あまいかおり","辛いにおい"],
            answer: 2,
            picture: "images/huiri.png"
        },
        {
            question: "サンタンカは沖縄では別の名前で呼ばれてる？",
            choices: ["別名がある！","名前は一つだよね！"],
            answer: 0,
            picture: "images/santa.png"
        },
            
        ];
        
        let index = 0;

        //問題を表示
        function showQuestion(){
            document.getElementById("quizResult").innerHTML = "";
            document.getElementById("quizResult").style.display = "none";
            document.getElementById("start-btn").style.display = "none";
            document.getElementById("result").textContent = "";
            document.getElementById("question").textContent = quiz[index].question;

            const choicesDiv = document.getElementById("choices");
            choicesDiv.innerHTML = "";

            const pictureDiv = document.getElementById("picture");
            pictureDiv.src  = quiz[index].picture; 
            pictureDiv.style.display = "block";
            pictureDiv.style.width = "auto";
            pictureDiv.style.height = "400px";

            quiz[index].choices.forEach((sentaku,i) =>{
                let btn = document.createElement("button");//選択肢ボタンを作る
                btn.textContent = sentaku;
                btn.onclick = () => checkAnswer(i);
                choicesDiv.appendChild(btn);
                btn.classList.add("choice-button");
            });
        }

        //答え合わせ
        function checkAnswer(selected){
            let result = document.getElementById("result");//結果位置をresultに入れる
            const buttons = document.querySelectorAll(".choice-button");

            //選択肢の無効化
            buttons.forEach(btn => btn.disabled = true);
            
            if (selected === quiz[index].answer){
                localStorage.setItem("問題" + (index + 1), "true");
                result.textContent = "正解！";
                result.className = "correct";
                keka.push("正解");
            }else{
                localStorage.setItem("問題"+ (index + 1),"false")
                result.textContent = "残念...";
                result.className = "wrong";
                keka.push("不正解");
            }
            document.getElementById("next").textContent = "次の問題に行く";
            document.getElementById("next").style.display = "inline";
            }
            
        function nextQuestion(){
            document.getElementById("eria").style.display = "none";
            index++;
            //写真の無効化
            document.getElementById("next").style.display ="none";
            document.getElementById("picture").style.display = "none";
            document.getElementById("picture").src = "";
            
            if (index < quiz.length){
                showQuestion();
            }else{
                document.getElementById("result").textContent = "";
                document.getElementById("question").textContent = "クイズ終了";
                document.getElementById("choices").innerHTML = "";
                document.getElementById("next").style.display = "none";
                showFinalResult();
        }
        }

        function showFinalResult(){
            let text = "";
            for (let i = 1; i <= quiz.length; i++){
                let correct = localStorage.getItem(`問題${i}`);
                if (correct === "true"){
                text += `<p class = "correct">問題${i}: 正解<br></p>`;
                }else{
                text += `<p class = "wrong">問題${i}: 不正解<br></p>`;
            }
        }
        document.getElementById("quizResult").innerHTML = text;
        document.getElementById("quizResult").style.display = "block";
        //nextボタン作成
        let next = document.getElementById("next")
        next.textContent = "最初からやる";
        next.style.display = "block";
        index = -1;
        //エリアに戻るボタンの表示
        document.getElementById("eria").style.display = "block";
        //クイズ結果をファイル間で扱えるようにする
        let kirokuArray = localStorage.setItem("eria1",JSON.stringify(saveData));
        
        }
    </script>
</body>
</html>
