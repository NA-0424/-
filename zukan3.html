<!DOCTYPE html>
<html lang="ja">
<link rel = "stylesheet" href = "css/zukan1.css">
<head>
 <meta charset="UTF-8">
 <title>植物図鑑</title>
 <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--フォントの設定-->
  <link rel="preconnect" href="https://fonts.googleapits.com">
  <link rel="perconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Philosopher&display=swap" rel="stylesheet">
</head>
<body>
 <h1>花の庭エリア</h1>


 <!--入力欄 -->
 <div>
   <input type="text" id="plantInput" placeholder="植物の名を入力">
   <button id="searchBtn" onclick="searchPlant()">決定</button>
 </div>
 <p id="husei" style="color:red;"></p>
 <h2 id="hint"></h2>


 <!-- カード（最初は裏面） -->
 <div>
   <img id="card1" class="card" src="images/kard0.png">
   <img id="card2" class="card" src="images/kard0.png">
   <img id="card3" class="card" src="images/kard0.png">
   <img id="card4" class="card" src="images/kard0.png">
   <br></br>
   <img id="card5" class="card" src="images/kard0.png">
   <img id="card6" class="card" src="images/kard0.png">
   <img id="card7" class="card" src="images/kard0.png">
 </div>
 
 <!-- クイズボタン（最初は非表示） -->
<div id="quizBtn" style="display:none;">
  <button id="quiz" onclick="goQuiz()">クイズに挑戦！</button>
  <button onclick="reset()">カードをすべて裏返す</button>
</div>

 <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
 <script>
   const hints= [
      {hint:"熊本の別名はー、、、？ 〇〇椿"},
      {hint: "おにぎりに入ってる酸っぱい実がなるお花だよ 〇"},
      {hint: "日本の桜の種類 〇〇〇ヨシノ"},
      {hint: "寒い季節を入れてみよう 〇〇ヤナギ"},
      {hint: "黄色い小さいお花がたくさん ソシン〇〇〇〇"},
      {hint: "手を握ってみて！ 〇〇シ"},
      {hint: "ツルツルの葉っぱと白いお花 オガタ〇〇〇"}
    ];
   // 図鑑3の植物
   const plantList = {
     "肥後椿": { id: "card1", img: "higo.png" },
     "梅": { id: "card2", img: "ume.png" },
     "ソメイヨシノ": { id: "card3", img: "somei.png" },
     "ユキヤナギ": { id: "card4", img: "yuki.png" },
     "ソシンロウバイ": { id: "card5", img: "sosin.png" },
     "コブシ": { id: "card6", img: "kobisi.png" },
     "オガタマノキ": { id: "card7", img: "ogata.png" },
   };


   // カードの裏面
   const defaultImage = "images/kard0.png";


   // ページ読み込み時に保存データを反映
   window.onload = function() {
     let allFlipped = true;
     //植物リストから名前（ローマ字）を抽出
     for (let name in plantList) {
       const cardId = plantList[name].id;//画像IDを取得
       //zukan1nameがtrueかどうか
       const saved = localStorage.getItem("zukan3-" + name);
       if (saved === "true") {
         document.getElementById(cardId).src = "images/" + plantList[name].img;
       } else {
         document.getElementById(cardId).src = defaultImage;
         allFlipped = false;
       }
     }
     // 全部揃ったらクイズ解放
     if (allFlipped) {
       document.getElementById("quizBtn").style.display = "inline-block";
       alert("クイズに挑戦しよう！");
     }

     //ヒントを表示するかの分岐処理
      const hint = document.getElementById("hints");
      const hintBtn = document.getElementById("hintsBtn");
      let hintID = localStorage.getItem("zukan3-hint");
   }


   // 植物検索
   function searchPlant() {
     const input = document.getElementById("plantInput").value.trim();//入力されたものを入れる
     const plant = plantList[input];


     if (plant) {
       // localStorage に保存
       localStorage.setItem("zukan3-" + input, "true");
       // correct.html に飛ぶ
       window.location.href = "correct3.html?area=zukan3&name=" + encodeURIComponent(input);
     } else {
       document.getElementById("husei").textContent = "その植物は存在しません";
     }
   }


   // クイズに飛ぶ
   function goQuiz() {
     window.location.href = "quiz3.html";
   }


   //リセットボタン
   function reset(){
       if (confirm("最初からになりますがいいですか？")){
           for (let i = 1; i < 8; i++ ){
               const img = document.getElementById("card" + i);
               img.src = defaultImage;
               let allFlipped = false
               document.getElementById("quizBtn").style.display = 'none';
           }
           localStorage.clear();//ローカルストレージを空にする
           alert("植物を燃やしました");
       }else{
           alert("キャンセルしました");
       }
   }

  $(document).ready(function(){
    $('#card1').on('click',function(){
      $('#hint')
      .text(hints[0].hint)  // ヒント内容をセット
      .removeClass('show')      // 一旦リセット（連続クリック対応）
      .hide()                   // 一瞬非表示にして
      .fadeIn(200)              // ふわっと表示
      .addClass('show');        // スタイル反映
    });
    $('#card2').on('click',function(){
      $('#hint')
      .text(hints[1].hint)  
      .removeClass('show')      
      .hide()                   
      .fadeIn(200)              
      .addClass('show');
    });
    $('#card3').on('click',function(){
      $('#hint')
      .text(hints[2].hint)  
      .removeClass('show')      
      .hide()                  
      .fadeIn(200)              
      .addClass('show');
    });
    $('#card4').on('click',function(){
      $('#hint')
      .text(hints[3].hint)  
      .removeClass('show')      
      .hide()                   
      .fadeIn(200)              
      .addClass('show');
    });
    $('#card5').on('click',function(){
      $('#hint')
      .text(hints[4].hint)  
      .removeClass('show')     
      .hide()                   
      .fadeIn(200)             
      .addClass('show');
    });
   $('#card6').on('click',function(){
      $('#hint')
      .text(hints[5].hint)  
      .removeClass('show')     
      .hide()                   
      .fadeIn(200)             
      .addClass('show');
    });
   $('#card7').on('click',function(){
      $('#hint')
      .text(hints[6].hint)  
      .removeClass('show')     
      .hide()                   
      .fadeIn(200)             
      .addClass('show');
    });
  });

 </script>
 </body>
</html>
